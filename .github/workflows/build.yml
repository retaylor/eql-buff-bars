# CI: build + test on Windows.
# Note: parser / spell-db tests that need the EverQuest Legends client files
# self-skip when the game is not installed (CI runners have no game files),
# so `dotnet test` stays green with a reduced assertion set in CI.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release
